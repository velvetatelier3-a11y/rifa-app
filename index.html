<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f78">
<link rel="manifest" href="manifest.json">
<title>Rifa Control</title>
<style>
:root{--teal:#087f78;--teal2:#dff3f1;--green:#2e9d4d;--orange:#d97918;--bg:#f4f8f8;--text:#183234;--muted:#6b7c7e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
header{background:#fff;padding:22px 18px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5eeee}
h1{margin:0 0 5px;font-size:24px}h2{font-size:19px;margin:20px 0 10px}.sub{color:var(--muted);font-size:14px}
main{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid #e1ebeb;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000a}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f8fbfb;border-radius:12px;padding:12px}.stat b{font-size:19px;display:block;margin-top:4px}.green{color:var(--green)}.orange{color:var(--orange)}
.progress{height:8px;background:#e7eeee;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);border-radius:10px}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:var(--teal);color:white;font-weight:600}button.secondary{background:#edf6f5;color:var(--teal)}button.danger{background:#fff0f0;color:#b33}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.session{cursor:pointer}.session .name{font-weight:700;font-size:16px}.money{font-weight:700;color:var(--teal)}
.filters{display:flex;gap:7px;overflow:auto;padding:5px 0}.filters button{white-space:nowrap;background:white;color:#506163;border:1px solid #dbe7e7}.filters button.active{background:var(--teal);color:white;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{padding:9px 2px;border:1px solid #dce6e6;background:#fff;color:#465759;border-radius:8px;text-align:center;font-size:12px;min-width:0}.num.paid{background:#e3f5e5;color:#22853b;border-color:#bfe2c5}.num.part{background:#fff0df;color:#bd6510;border-color:#f0cfaa}.num.selected{outline:2px solid var(--teal)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dfe9e9;padding:8px;display:flex;gap:8px;z-index:10}.bottom button{flex:1;background:white;color:#657274;border:1px solid #dce7e7}.bottom button.active{background:var(--teal);color:white}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0;font-size:25px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#687779;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #ccdada;border-radius:11px;background:white}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.loginbox{width:100%;max-width:420px;background:white;padding:25px;border-radius:22px;box-shadow:0 8px 35px #00000012}.loginbox h1{color:var(--teal);font-size:30px}.loginbox button{width:100%;margin-top:8px}.error{color:#b33;font-size:14px;margin-top:10px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.grid{gap:7px}.num{font-size:13px;padding:10px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const USERS={Administrador:{role:"admin"}, "Rifa 1":{role:"rifa"}, "Rifa 2":{role:"rifa"}, "Rifa 3":{role:"rifa"}, "Rifa 4":{role:"rifa"}, "Rifa 5":{role:"rifa"}, "Rifa 6":{role:"rifa"}, "Rifa 7":{role:"rifa"}, "Rifa 8":{role:"rifa"}, "Rifa 9":{role:"rifa"}, "Rifa 0":{role:"rifa"}};
const defaultPass="1234";
let data=JSON.parse(localStorage.getItem("rifaData")||"{}");
let current=localStorage.getItem("rifaUser")||"";
let view="sessions", activeRifa="", filter="all", selected=null;

function save(){localStorage.setItem("rifaData",JSON.stringify(data))}
function initRifa(name){if(!data[name]){data[name]={price:500,numbers:{}};save()}}
Object.keys(USERS).filter(x=>x!="Administrador").forEach(initRifa);

function login(){
app.innerHTML=`<div class="login"><div class="loginbox"><h1>Rifa Control</h1><p class="sub">Administración de rifas</p>
<div class="field"><label>Usuario</label><select id="user">${Object.keys(USERS).map(u=>`<option>${u}</option>`).join("")}</select></div>
<div class="field"><label>Contraseña</label><input id="pass" type="password" placeholder="Contraseña"></div>
<button onclick="doLogin()">Entrar</button><p class="sub" style="margin-top:14px">Versión inicial: contraseña temporal <b>1234</b>.</p><div id="err" class="error"></div></div></div>`;
}
function doLogin(){let u=user.value,p=pass.value;if(p!==defaultPass){err.textContent="Contraseña incorrecta.";return}current=u;localStorage.setItem("rifaUser",u);view=u==="Administrador"?"sessions":"card";activeRifa=u==="Administrador"?"Rifa 1":u;render()}
function logout(){localStorage.removeItem("rifaUser");current="";login()}
function nums(r){initRifa(r);return data[r].numbers}
function counts(r){let n=nums(r),paid=0,part=0;Object.values(n).forEach(x=>x.status==="paid"?paid++:x.status==="part"&&part++);return {paid,part,sold:paid+part}}
function money(r){let c=counts(r);return c.paid*data[r].price+c.part*data[r].price}
function render(){if(!current)return login(); if(view==="sessions")sessions(); else if(view==="card")card(); else summary()}
function sessions(){
let rs=Object.keys(USERS).filter(x=>x!="Administrador");
app.innerHTML=`<header><h1>Hola, Administrador</h1><div class="sub">10 rifas · hasta 1.000 números cada una</div></header><main>
<h2>Sesiones</h2>${rs.map(r=>{let c=counts(r),pct=(c.sold/1000*100).toFixed(0);return `<div class="card session" onclick="openRifa('${r}')"><div class="row"><div><div class="name">${r}</div><div class="sub">${c.sold}/1000 vendidos · $${money(r).toLocaleString()}</div></div><b>${pct}%</b></div><div class="progress" style="margin:10px 0"><i style="width:${pct}%"></i></div><div class="row"><span class="green">● Pagados: ${c.paid} · $${(c.paid*data[r].price).toLocaleString()}</span><span class="orange">● Abonados: ${c.part} · $${(c.part*data[r].price).toLocaleString()}</span></div></div>`}).join("")}
<button class="secondary" onclick="logout()">Cerrar sesión</button></main>${bottom("sessions")}`;
}
function openRifa(r){activeRifa=r;view="card";render()}
function card(){
let r=activeRifa,c=counts(r),n=nums(r),items=[];
for(let i=1;i<=1000;i++){let x=n[i],ok=filter==="all"||(filter==="paid"&&x?.status==="paid")||(filter==="part"&&x?.status==="part")||(filter==="free"&&!x);if(ok)items.push([i,x])}
app.innerHTML=`<header><div class="row"><div><h1>${r}</h1><div class="sub">${c.sold}/1000 vendidos · $${money(r).toLocaleString()}</div></div><button class="secondary" onclick="view='sessions';render()">Volver</button></div></header><main>
<div class="filters"><button class="${filter==='all'?'active':''}" onclick="filter='all';render()">Todos</button><button class="${filter==='free'?'active':''}" onclick="filter='free';render()">Disponibles</button><button class="${filter==='part'?'active':''}" onclick="filter='part';render()">🟠 Abonados</button><button class="${filter==='paid'?'active':''}" onclick="filter='paid';render()">🟢 Pagados</button></div>
<div class="card"><div class="grid">${items.map(([i,x])=>`<button class="num ${x?.status==='paid'?'paid':x?.status==='part'?'part':''}" onclick="edit(${i})">${String(i).padStart(3,'0')}</button>`).join("")}</div></div>
<div class="card"><div class="row"><span class="green">● Pagados: ${c.paid}</span><span class="orange">● Abonados: ${c.part}</span><b>$${money(r).toLocaleString()}</b></div></div>
</main>${bottom("card")}`;
}
function edit(i){
selected=i;let x=nums(activeRifa)[i]||{name:"",phone:"",status:"",paid:0};
app.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><div class="row"><div><h2>Boleto ${String(i).padStart(3,'0')}</h2><div class="sub">${activeRifa}</div></div><button class="secondary" onclick="closeModal()">Cerrar</button></div>
<div class="field"><label>Nombre del comprador</label><input id="buyer" value="${esc(x.name)}"></div>
<div class="field"><label>Teléfono</label><input id="phone" value="${esc(x.phone)}" inputmode="tel"></div>
<div class="field"><label>Estado</label><select id="status"><option value="">Disponible</option><option value="part" ${x.status==='part'?'selected':''}>Abonado</option><option value="paid" ${x.status==='paid'?'selected':''}>Pagado</option></select></div>
<div class="field"><label>Precio del boleto</label><input id="price" type="number" value="${x.price||data[activeRifa].price}"></div>
<button style="width:100%" onclick="saveTicket()">Guardar boleto</button>${x.name?`<button class="danger" style="width:100%;margin-top:8px" onclick="removeTicket()">Liberar número</button>`:""}</div></div>`);
}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function closeModal(){document.getElementById("modal")?.remove()}
function saveTicket(){let st=status.value,n=nums(activeRifa);if(!st){delete n[selected]}else n[selected]={name:buyer.value,phone:phone.value,status:st,price:Number(price.value)||data[activeRifa].price};save();closeModal();render()}
function removeTicket(){delete nums(activeRifa)[selected];save();closeModal();render()}
function summary(){
let rs=Object.keys(USERS).filter(x=>x!="Administrador"), rows=[];rs.forEach(r=>Object.entries(nums(r)).forEach(([i,x])=>{if(x.status==="part")rows.push({r,i,x})}));
app.innerHTML=`<header><h1>Resumen general</h1><div class="sub">Todos los números pendientes de pago</div></header><main><div class="stats card">${rs.reduce((a,r)=>a+counts(r).sold,0)}<span class="sub"> vendidos</span></div><h2>Pendientes de pago (${rows.length})</h2>${rows.length?rows.map(o=>`<div class="card"><div class="row"><div><b>${esc(o.x.name)||"Sin nombre"}</b><div class="sub">${o.r} · Boleto ${String(o.i).padStart(3,'0')} · ${esc(o.x.phone)}</div></div><b class="orange">$${Number(o.x.price||data[o.r].price).toLocaleString()}</b></div></div>`).join(""):"<div class='card'>No hay boletos abonados pendientes.</div>"}</main>${bottom("summary")}`;
}
function bottom(active){return `<nav class="bottom"><button class="${active==='sessions'?'active':''}" onclick="view='sessions';render()">👥 Sesiones</button><button class="${active==='card'?'active':''}" onclick="view='card';render()">▦ Carta</button><button class="${active==='summary'?'active':''}" onclick="view='summary';render()">▥ Resumen</button></nav>`}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body></html>
